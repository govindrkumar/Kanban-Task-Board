<!DOCTYPE html>
<html>
    <head>
        <title>Task-Board App</title>
        <link rel="stylesheet" href="style.css">
        <script src="scripts.js" defer></script>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="index.html">All Tasks</a></li>
                <li><a href="timer.html">Timer</a></li>
                <li><a href="#">Upcoming (not finished)</a></li>
                <li><a href="#">Completed(not done)</a></li>
                <li><a href="#">Settings(not done)</a></li>
            </ul>
        </nav>

        <div class="heading">
            <h1>Welcome Mr. Lazy 😪 </h1>
            <br>
            <h4>You won't be completing task. Would you?</h4>
            <br>
            <h5>Do nothing. Be Proud!!</h5>
        </div>

        <div class="task-add">
            <div class="heading-taskboard"><h4>Add Your Task</h4></div>
            <form>
                <label for="todo">+</label>
                <input type="text" name="todo" 
                id="todo" placeholder="What do you want to write?">
                <input type="button" id= "add-task" value="⬆">
            </form>
        </div>


        <div class="task-score">
            <h4>Your Scores</h4>

            <div class="score-items">
                <div class="completed-task">
                    Completed : 0
                </div>

                <div class="incomplete-task">
                    Not completed : 0
                </div>
            </div>
        </div>

        <div class="main-board-score">
            <h3>Tasks</h3>
            <div class="task-list" id="task-list">
                <h2>Nothing here....</h2>
            </div>
        </div>

    </body>
</html>
